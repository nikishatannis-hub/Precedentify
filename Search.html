<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search - PreceDentify</title>
  <link rel="icon" href="/LOGO.jpeg" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      padding: 15px 30px;
      background-color: #222;
    }

    .navbar .logo {
      font-weight: bold;
      font-size: 24px;
      color: #ff7200;
    }

    .navbar .menu ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    .navbar .menu ul li a {
      text-decoration: none;
      color: white;
      font-size: 16px;
    }

    .navbar .menu ul li a:hover {
      color: #ff7200;
    }

    .content {
      text-align: center;
      padding: 40px 20px;
    }

    .content h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .content span {
      color: #ff7200;
    }

    .par {
      font-size: 18px;
      color: #ccc;
    }

    .search-container {
      display: flex;
      justify-content: center;
      margin-top: 30px;
    }

    .search {
      display: flex;
      width: 60%;
    }

    .srch {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 5px 0 0 5px;
    }

    .btn {
      background: #ff7200;
      color: white;
      border: none;
      padding: 12px 20px;
      cursor: pointer;
      border-radius: 0 5px 5px 0;
      font-size: 16px;
    }

    .btn:hover {
      background: white;
      color: #ff7200;
    }

    ul.case-titles {
      max-width: 700px;
      margin: 30px auto 0 auto;
      padding: 0;
      list-style: none;
      text-align: left;
    }

    ul.case-titles li {
      background: #222;
      padding: 15px 20px;
      margin-bottom: 15px;
      border-left: 5px solid #ff7200;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    ul.case-titles li a {
      text-decoration: none;
      color: #ff7200;
      font-weight: bold;
    }

    ul.case-titles li a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="main">
    <!-- Navigation Bar -->
    <div class="navbar">
      <div class="logo">PreceDentify</div>
      <div class="menu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="Search.html">Search</a></li>
          <li><a href="Law and firm.html">General Laws</a></li>
          <li><a href="Raise Complaints.html">Raise Complaints</a></li>
          <li><a href="About.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>

    <!-- Hero Section -->
    <div class="content">
      <h1>Find Legal <span>Precedents</span></h1>
      <p class="par">AI-powered legal research platform for accurate case search.</p>

      <!-- Centered Search Bar -->
      <div class="search-container">
        <div class="search">
            <input class="srch" type="text" id="searchInput" placeholder="Enter Case Details...">
            <button class="btn" onclick="searchCases()">Search</button>
        </div>
    </div>
</div>

      <!-- Search Results -->
      <div id="results"></div>
    </div>
  </div>

  <script>
    function searchCases() {
      let query = document.getElementById('searchInput').value.trim().toLowerCase();

      let validCases = [
        "k.armstrong death case",
        "k armstrong death case",
        "k. armstrong case",
        "k armstrong case",
        "k. armstrong vs. the state of tamil nadu"
      ];

      if (validCases.includes(query)) {
        document.getElementById('results').innerHTML = `
          <ul class="case-titles">
            <li><a href="case-details.html?case=K.Armstrong%20Death%20Case">1. K. Armstrong v. State of Tamil Nadu (2004)</a></li>
            <li><a href="#">2. A. Gopalakrishnan v. Union of India (2007)</a></li>
            <li><a href="#">3. Rekha v. State of Tamil Nadu (2011)</a></li>
            <li><a href="#">4. Huidrom Konungjao Singh v. State of Manipur (2012)</a></li>
            <li><a href="#">5. Dr. Ram Manohar Lohia v. State of Bihar (1966)</a></li>
          </ul>`;
      } else {
        document.getElementById('results').innerHTML = "<p style='color: #ff7200; margin-top: 20px;'>No results found. Please try a different search term.</p>";
      }
    }
  </script>
</body>
</html>
