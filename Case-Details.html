<head>

    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: url("justice.jpg")no-repeat center center/cover;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;

        .case-container {
            max-width: 70%;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            text-align: justify;
            text-justify: inter-word;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.2);
        }

        .case-container h2 {
            text-align: center;
        }

        .case-container a {
            color: #ff7200;
            font-weight: bold;
            text-decoration: none;
        }

        .case-container a:hover {
            text-decoration: underline;
        }

        ul {
            padding-left: 20px;
        }

            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="main">
        <!-- Navigation Bar -->
        <div class="navbar">
            <div class="logo">PreceDentify</div>
            <div class="menu">
                <ul>
                    <li><a href="index.html">Home</a></li>

                </ul>
            </div>
        </div>
    <div class="case-container" id="caseDetails">
        <h2>Loading case details...</h2>
    </div>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        const caseName = getQueryParam("case");

        if (caseName === "K.Armstrong Death Case") {
            document.getElementById("caseDetails").innerHTML = `
                <h2>Case Name: Porkodi vs The State Rep.</h2>
                <p><strong>Judgment Date:</strong> July 7, 2024</p>
                <p><strong>Legal Citation:</strong> 2024 SC 150</p>
                <p><strong>Case Summary:</strong> The case concerns the tragic death of K. Armstrong, where the court examined evidence of criminal negligence and related legal precedents to determine the nature of the offense. The verdict revolves around the application of <strong>Section 302 IPC</strong> (Murder) and <strong>Section 304 IPC</strong> (Culpable Homicide not amounting to Murder), with emphasis on the legal standards for criminal negligence.</p>
                <a href="https://indiankanoon.org/doc/141916664/" target="_blank">Read Full Judgment on Indian Kanoon</a>
                <p><strong>Key Legal Precedents Discussed:</strong></p>
                <ul>
                    <li><strong>Clarified the difference be Ramprasad Wamanrao Kadam Bordikar vs The State Of Maharashtra And Ors. (1996):</strong>Legislature can't overrule judgments but can change laws to alter the basis of judicial decisions. </li>
                    <a href="https://indiankanoon.org/doc/321811/" target="_blank">Read Full Judgement on Indian Kanoon</a>
                    <li><strong>Kodali Puranchandra Rao & Anr vs The Public Prosecutor, Andhra Pradesh (1975):</strong> This case emphasized the importance of stressed circumstantial evidence's role, warning against conclusions based on mere suspicion.</li>
                    <a href="https://indiankanoon.org/doc/1038117/" target="_blank">Read Full Judgement on Indian Kanoon</a>
                    <li><strong>K.C. Gajapati Narayana Deo And Ors. vs The State Of Orissa:</strong>Legislature can't overrule courts but may alter laws to change judicial decision conditions (colorable legislation).</li>
                    <a href="https://indiankanoon.org/doc/1248239/" target="_blank">Read Full Judgement on Indian Kanoon</a>
                    <li><strong>K. Amarnath S/O O.K. Prasad vs The Collector And District Magistrate (2004):</strong>This judgment addressed the distinction between issues of public order and law and order, highlighting the importance of proximate incidents in justifying detention orders. </li>
                    <a href="https://indiankanoon.org/doc/926111/" target="_blank">Read Full Judgement on Indian Kanoon</a>
                    <li><strong>M.C. Mehta v. Union of India (1987) 1 SCC 395:</strong> Set precedents on the responsibility of industries and individuals for harm prevention.</li>
                    <a href="https://indiankanoon.org/doc/1486949/" target="_blank">Read Full Judgement on Indian Kanoon</a>
                </ul>
            `;
        } else {
            document.getElementById("caseDetails").innerHTML = "<h2>No case details found.</h2>";
        }
    </script>
